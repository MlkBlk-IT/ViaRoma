name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt setuptools wheel

      - name: Compile every module
        run: python -m compileall -q src tests

      # A white dashboard (only one closing parenthesis missing) has been cut
      # the entire interface without any visible errors. We check the syntax
      # of ALL JS scripts with each commit.
      - name: Syntaxe JS (dashboard + lanceurs npm)
        run: |
          set -e
          mkdir -p /tmp/vrcheck
          for f in src/dashboard/static/*.js; do
            # node --check parse in CommonJS: an ESM module goes through a
            # copy .mjs (the .js in the dashboard are ESM modules).
            if ! node --check "$f" 2>/dev/null; then
              cp "$f" /tmp/vrcheck/check.mjs
              node --check /tmp/vrcheck/check.mjs || { echo "SYNTAXE KO: $f"; exit 1; }
            fi
          done
          for f in bin/*.mjs scripts/*.mjs; do
            node --check "$f" || { echo "SYNTAXE KO: $f"; exit 1; }
          done
          echo "syntaxe JS OK"

      - name: Secrets Scanner Self-Test
        run: node scripts/selftest_scan_secrets.mjs

      - name: Secrets scan (entire repository)
        run: node scripts/scan_secrets.mjs

      - name: Publication safeguards (what goes in the package)
        run: node scripts/prepack.mjs

      - name: Building the npm package
        run: npm pack --dry-run

      - name: Construction of the PyPI wheel + asset control
        run: |
          python -m pip wheel . --no-deps -w dist
          python scripts/verify_wheel.py

      - name: Burn chain (403/429 -> lane burn, good account_id)
        run: python tests/test_burn_chain.py

      - name: Identity module (stable, distinct, consistent)
        run: python tests/test_identity.py

      - name: MCP server (5 tools, clean stdout, no secret exposed)
        run: python tests/test_mcp_server.py

      - name: Security & routing context (fail-closed IP, TLS, cookies)
        run: python tests/test_security_context.py

      - name: Anti-IP leak proof (5 levels, offline)
        run: python tests/test_ip_leak.py
