[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "via-roma"
version = "0.1.0"
description = "ViaRoma - Free Frontier Router. Un MCP qui donne acces a des modeles frontier gratuits: egress IP jetable, sessions persistantes, cascade automatique."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - All Rights Reserved" }
keywords = ["mcp", "llm", "openai-compatible", "free-tier", "cascade", "circuit-breaker", "egress", "proxy-pool", "tls-fingerprint"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Internet :: Proxy Servers",
]

dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "pydantic>=2.7.0",
  "curl_cffi>=0.7.0",
  "aiohttp>=3.9.3",
  "playwright>=1.40.0",
  "mcp>=2.0.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# No optional extras: redis was not used by the kernel (dead list).

[project.urls]
Homepage = "https://github.com/MlkBlk-IT/ViaRoma"
Repository = "https://github.com/MlkBlk-IT/ViaRoma"
Issues = "https://github.com/MlkBlk-IT/ViaRoma/issues"

[project.scripts]
via-roma-mcp = "src.mcp_server:main"
via-roma = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
# static/vendor/** is REQUIRED: three.js (3D renderer of the Colosseum) is
# sold in the depot. Without it, the dashboard of the installed package opens but
# the 3D Colosseum remains silent.
"src.dashboard" = [
    "static/*.html",
    "static/*.css",
    "static/*.js",
    "static/*.svg",
    "static/vendor/**/*",
]
